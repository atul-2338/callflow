# CallFlow — Nginx reverse proxy for callflow.biz / www.callflow.biz
#
# Install:  sudo cp deploy/nginx/callflow.conf /etc/nginx/sites-available/callflow.conf
#           sudo ln -s /etc/nginx/sites-available/callflow.conf /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# This file deliberately contains NO `listen 443` / `ssl_certificate` directives.
# Run certbot against it and let certbot add the TLS server block plus the 80->443
# redirect itself:
#
#           sudo certbot --nginx -d callflow.biz -d www.callflow.biz
#
# Hand-writing those lines first would mean a window where Nginx cannot start at
# all (no cert on disk yet), which is the one failure mode that takes the whole
# site down instead of just the certificate.

# Standard boilerplate for forwarding WebSocket upgrades. Nothing in the app uses
# WebSockets today; it is here so a future feature does not need an Nginx edit.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream callflow_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name callflow.biz www.callflow.biz;

    access_log /var/log/nginx/callflow.access.log;
    error_log  /var/log/nginx/callflow.error.log;

    # Every payload this app accepts is small JSON or a urlencoded webhook POST
    # (Plivo). This is a ceiling against someone streaming a huge body into the
    # Node process, not a feature limit — raise it if file uploads ever land.
    client_max_body_size 1m;

    location / {
        proxy_pass http://callflow_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_buffering       off;
    }
}
