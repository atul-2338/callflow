name: Stage A validation

on:
  push:
    branches: [feature/stage-a-registration-data]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/stage-a-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-a-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint and production build (isolated CI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities (report only)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.vulnerabilities||{}; console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,packages:Object.entries(v).map(([name,x])=>({name,severity:x.severity,isDirect:x.isDirect,range:x.range,fixAvailable:x.fixAvailable,via:x.via.map(y=>typeof y==="string"?y:{name:y.name,title:y.title,url:y.url,range:y.range})}))},null,2))'

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build
